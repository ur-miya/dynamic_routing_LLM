seed: 42
splits: [train, val, test]
input_pattern: data/processed/{split}.jsonl
work_dir: data/generations/parts
output_pattern: data/generations/{split}_generations.parquet
log_dir: artifacts/logs/generation
manifest_dir: artifacts/generation
row_group_size: 128
shard_size: 256
include_history: true
system_prompt: You are a helpful, accurate, and concise assistant.

teacher:
  max_new_tokens: 512
  temperature: 0.0
  top_p: 1.0
  logprobs: 10
  concurrency: 2
  requests_per_second: 0.0
  n_samples: 1
  stop: ["<|im_end|>", "<|endoftext|>"]

student:
  batch_size: 2
  max_input_tokens: 4096
  max_new_tokens: 512
  do_sample: true
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.0
  seed: 42
  n_samples: 1
  save_selected_logprobs: true
  scoring_batch_size: 1

teacher_score:
  enabled: true
  top_logprobs: 10
  concurrency: 2
  requests_per_second: 0.0
  sequences: [SGO]
